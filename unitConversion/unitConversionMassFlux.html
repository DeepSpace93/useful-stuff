<!DOCTYPE html>
<html lang="en">

<head>
  <title>Mass Flux Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Mass Flux</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round to
    <input type="number" id="decimals" min="0" max="10" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="mass_flux" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="kg$m2$s">kg/(m²·s)</option>
      <option value="kg$m2$min">kg/(m²·min)</option>
      <option value="kg$m2$h">kg/(m²·h)</option>
      <option value="g$cm2$s">g/(cm²·s)</option>
      <option value="lb$ft2$s">lb/(ft²·s)</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="kg$m2$s">kg/(m²·s)</option>
      <option value="kg$m2$min">kg/(m²·min)</option>
      <option value="kg$m2$h">kg/(m²·h)</option>
      <option value="g$cm2$s">g/(cm²·s)</option>
      <option value="lb$ft2$s">lb/(ft²·s)</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
