<!DOCTYPE html>
<html lang="en">

<head>
  <title>Kinematic Viscosity Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Kinematic Viscosity</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round to
    <input type="number" id="decimals" min="0" max="10" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="kinematic_viscosity" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="mm2$s">mm²/s</option>
      <option value="m2$s">m²/s</option>
      <option value="cm2$s">cm²/s</option>
      <option value="cSt">cSt</option>
      <option value="St">St</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="mm2$s">mm²/s</option>
      <option value="m2$s">m²/s</option>
      <option value="cm2$s">cm²/s</option>
      <option value="cSt">cSt</option>
      <option value="St">St</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
