<!DOCTYPE html>
<html lang="en">

<head>
  <title>Specific Resistance and Conductance Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Specific Resistance and Conductance Unit Conversion</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round to
    <input type="number" id="decimals" min="0" max="10" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="specific_resistance_conductance" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="Ohm_mm2$m">Ω·mm²/m</option>
      <option value="Ohm_m">Ω·m</option>
      <option value="uOhm_m">µΩ·m</option>
      <option value="mOhm_m">mΩ·m</option>
      <option value="S$m">S/m</option>
      <option value="kS$m">kS/m</option>
      <option value="MS$m">MS/m</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="Ohm_mm2$m">Ω·mm²/m</option>
      <option value="Ohm_m">Ω·m</option>
      <option value="uOhm_m">µΩ·m</option>
      <option value="mOhm_m">mΩ·m</option>
      <option value="S$m">S/m</option>
      <option value="kS$m">kS/m</option>
      <option value="MS$m">MS/m</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
