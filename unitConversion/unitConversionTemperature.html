<!DOCTYPE html>
<html lang="en">

<head>
  <title>Temperature Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Temperature</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round
    to
    <input type="number" id="decimals" size="1" min="0" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="temperature" />
    <input type="number" id="value_in" value="20" />
    <select id="unit_in">
      <option value="C">°C</option>
      <option value="K">K</option>
      <option value="F">°F</option>
      <option value="R">°R</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="C">°C</option>
      <option value="K">K</option>
      <option value="F">°F</option>
      <option value="R">°R</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
  <br />
  <img src="../img/UnitConversion_Temperature.png" />
</body>

</html>
