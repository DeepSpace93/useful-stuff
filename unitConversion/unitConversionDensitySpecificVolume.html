<!DOCTYPE html>
<html lang="en">

<head>
  <title>Density and Specific Volume Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Density and Specific Volume</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round
    to
    <input type="number" id="decimals" size="1" min="0" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="density_specific_volume" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="kg$m3">kg/m³</option>
      <option value="g$cm3">g/cm³</option>
      <option value="g$l">g/l</option>
      <option value="kg$l">kg/l</option>
      <option value="lb$in3">lb/in³</option>
      <option value="lb$ft3">lb/ft³</option>
      <option value="slug$ft3">slug/ft³</option>
      <option value="m3$kg">m³/kg</option>
      <option value="cm3$g">cm³/g</option>
      <option value="l$g">l/g</option>
      <option value="l$kg">l/kg</option>
      <option value="in3$lb">in³/lb</option>
      <option value="ft3$lb">ft³/lb</option>
      <option value="ft3$slug">ft³/slug</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="kg$m3">kg/m³</option>
      <option value="g$cm3">g/cm³</option>
      <option value="g$l">g/l</option>
      <option value="kg$l">kg/l</option>
      <option value="lb$in3">lb/in³</option>
      <option value="lb$ft3">lb/ft³</option>
      <option value="slug$ft3">slug/ft³</option>
      <option value="m3$kg">m³/kg</option>
      <option value="cm3$g">cm³/g</option>
      <option value="l$g">l/g</option>
      <option value="l$kg">l/kg</option>
      <option value="in3$lb">in³/lb</option>
      <option value="ft3$lb">ft³/lb</option>
      <option value="ft3$slug">ft³/slug</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
