<!DOCTYPE html>
<html lang="en">

<head>
    <title>Electromagnetic Radiation</title>
    <meta charset="UTF-8" />

    <style>
        table,
        td,
        th {
            border: 1px solid black;
            padding-top: 0px;
            padding-bottom: 0px;
            padding-left: 10px;
            padding-right: 20px;
            text-align: left;
        }

        table {
            border-collapse: collapse;

        }

        tbody tr:nth-child(even) {
            background-color: #C0C0C0;
        }

        thead th {
            background-color: #A9A9A9;
            position: sticky;
            top: 0;
            z-index: 2;
        }
    </style>
</head>

<body>
    <h1>Electromagnetic Radiation</h1>
    <table>
        <tbody>
            <tr>
                <td rowspan="7">visible</td>
                <td>red</td>
                <td>640 - 780 nm</td>
            </tr>
            <tr>
                <td>oragne</td>
                <td>600 - 640 nm</td>
            </tr>
            <tr>
                <td>yellow</td>
                <td>570 - 600 nm</td>
            </tr>
            <tr>
                <td>green</td>
                <td>500 - 570 nm</td>
            </tr>
            <tr>
                <td>
                    cyan
                </td>
                <td>485 - 500 nm</td>
            </tr>
            <tr>
                <td>blue</td>
                <td>430 - 485 nm</td>
            </tr>
            <tr>
                <td>violet</td>
                <td>380 - 430 nm</td>
            </tr>
            <tr>
                <td rowspan="4">UV</td>
                <td>UV-A</td>
                <td>315 - 380 nm</td>
            </tr>
            <tr>

                <td>UV-B</td>
                <td>280 - 315 nm</td>
            </tr>
            <tr>
                <td>UV-C</td>
                <td>100 - 280 nm</td>
            </tr>
            <tr>
                <td>EUV</td>
                <td>10 - 121 nm</td>
            </tr>
            <tr>
                <td colspan="2">X-Ray</td>
                <td>0.1 - 10nm</td>
            </tr>
            <tr>
                <td colspan="2">Gamma</td>
                <td>< 0.1 nm</td>
            </tr>
        </tbody>
    </table>



    <p><a href="index.html">Index</a></p>
</body>

</html>
