<!DOCTYPE html>
<html lang="en">

<head>
    <title>Greatest Common Divisor</title>
    <meta charset="UTF-8" />
</head>

<body>
    <script src="./js/modules/gcd.js"></script>
    <script src="./js/gcdIO.js"></script>
    <h1>Greatest Common Divisor</h1>

    <form>
        <table>
            <tr>
                <td>
                    a:
                </td>
                <td>
                    <input type="number" id="a" value="12" style="width: 6em" />
                </td>
                <td>
                    a/GCD:
                </td>
                <td>
                    <input type="number" id="a$gcd" style="width: 6em" readonly />
                </td>
            </tr>
            <tr>
                <td>
                    b:
                </td>
                <td>
                    <input type="number" id="b" value="18" style="width: 6em" />
                </td>
                <td>
                    b/GCD:
                </td>
                <td>
                    <input type="number" id="b$gcd" style="width: 6em" readonly />
                </td>
            </tr>
        </table>
        <br>
        <table>
            <tr>
                <td>
                    GCD
                </td>
                <td>
                    <input type="text" id="gcd" style="width: 6em" readonly />
                </td>
            </tr>
        </table>
    </form>
    <br>
    <button type="button" onclick="gcdIO()">Calculate</button>
    <p><a href="index.html">Index</a></p>
</body>
