<!DOCTYPE html>
<html lang="en">

<head>
  <title>Coefficient of Thermal Expansion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Coefficient of Thermal Expansion</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round
    to
    <input type="number" id="decimals" size="1" min="0" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="coefficient_of_thermal_expansion" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="$K">1/K</option>
      <option value="$R">1/°R</option>
      <option value="mm$m$K">mm/(m·K)</option>
      <option value="um$m$K">µm/(m·K)</option>
      <option value="$E6K">1E-6/K</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="$K">1/K</option>
      <option value="$R">1/°R</option>
      <option value="mm$m$K">mm/(m·K)</option>
      <option value="um$m$K">µm/(m·K)</option>
      <option value="$E6K">1E-6/K</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
