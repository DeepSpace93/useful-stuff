<!DOCTYPE html>
<html lang="en">

<head>
  <title>Greek Alphabet</title>
  <meta charset="UTF-8" />
  <style>
    table,
    td,
    th {
      border: 1px solid black;
      padding-top: 0px;
      padding-bottom: 0px;
      padding-left: 20px;
      padding-right: 10px;
      text-align: center;
    }

    table {
      border-collapse: collapse;

    }
  </style>
</head>

<body>
  <h1>Greek Alphabet</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Upper</th>
      <th>Lower</th>
    </tr>
    <tr>
      <td>Alpha</td>
      <td>Α</td>
      <td>α</td>
    </tr>
    <tr>
      <td>Beta</td>
      <td>Β</td>
      <td>β</td>
    </tr>
    <tr>
      <td>Gamma</td>
      <td>Γ</td>
      <td>γ</td>
    </tr>
    <tr>
      <td>Delta</td>
      <td>Δ</td>
      <td>δ</td>
    </tr>
    <tr>
      <td>Epsilon</td>
      <td>Ε</td>
      <td>ϵ, ε</td>
    </tr>
    <tr>
      <td>Zeta</td>
      <td>Ζ</td>
      <td>ζ</td>
    </tr>
    <tr>
      <td>Eta</td>
      <td>Η</td>
      <td>η</td>
    </tr>
    <tr>
      <td>Theta</td>
      <td>Θ</td>
      <td>θ, ϑ</td>
    </tr>
    <tr>
      <td>Iota</td>
      <td>Ι</td>
      <td>ι</td>
    </tr>
    <tr>
      <td>Kappa</td>
      <td>Κ</td>
      <td>κ, ϰ</td>
    </tr>
    <tr>
      <td>Lambda</td>
      <td>Λ</td>
      <td>λ</td>
    </tr>
    <tr>
      <td>Mu</td>
      <td>Μ</td>
      <td>μ</td>
    </tr>
    <tr>
      <td>Nu</td>
      <td>Ν</td>
      <td>ν</td>
    </tr>
    <tr>
      <td>Xi</td>
      <td>Ξ</td>
      <td>ξ</td>
    </tr>
    <tr>
      <td>Omicron</td>
      <td>Ο</td>
      <td>ο</td>
    </tr>
    <tr>
      <td>Pi</td>
      <td>Π</td>
      <td>π, ϖ</td>
    </tr>
    <tr>
      <td>Rho</td>
      <td>Ρ</td>
      <td>ρ, ϱ</td>
    </tr>
    <tr>
      <td>Sigma</td>
      <td>Σ</td>
      <td>σ, ς</td>
    </tr>
    <tr>
      <td>Tau</td>
      <td>Τ</td>
      <td>τ</td>
    </tr>
    <tr>
      <td>Upsilon</td>
      <td>Υ</td>
      <td>υ</td>
    </tr>
    <tr>
      <td>Phi</td>
      <td>Φ</td>
      <td>ϕ, φ</td>
    </tr>
    <tr>
      <td>Chi</td>
      <td>Χ</td>
      <td>χ</td>
    </tr>
    <tr>
      <td>Psi</td>
      <td>Ψ</td>
      <td>ψ</td>
    </tr>
    <tr>
      <td>Omega</td>
      <td>Ω</td>
      <td>ω</td>
    </tr>
  </table>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
