<!DOCTYPE html>
<html lang="en">

<head>
  <title>Temperature Unit Conversion</title>
  <meta charset="UTF-8" />
  <style>
    table,
    td,
    th {
      border: 1px solid black;
      padding-top: 5px;
      padding-bottom: 5px;
      padding-left: 5px;
      padding-right: 5px;
      text-align: center;
    }

    table {
      border-collapse: collapse;

    }
  </style>
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Temperature</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round
    to
    <input type="number" id="decimals" size="1" min="0" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="temperature" />
    <input type="number" id="value_in" value="20" />
    <select id="unit_in">
      <option value="C">°C</option>
      <option value="K">K</option>
      <option value="F">°F</option>
      <option value="R">°R</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="C">°C</option>
      <option value="K">K</option>
      <option value="F">°F</option>
      <option value="R">°R</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
  <br />
  <table>
    <tr>
      <th>to\from</th>
      <th>°C</th>
      <th>K</th>
      <th>°F</th>
      <th>°R</th>
    </tr>
    <tr>
      <th>°C</th>
      <td>1</td>
      <td>K − 273.15</td>
      <td>5/9(°F − 32)</td>
      <td>5/9(°R − 491.67)</td>
    </tr>
    <tr>
      <th>K</th>
      <td>°C + 273.15</td>
      <td>1</td>
      <td>5/9(°F + 459.67)</td>
      <td>5/9°R</td>
    </tr>
    <tr>
      <th>°F</th>
      <td>9/5°C + 32</td>
      <td>9/5K − 459.67</td>
      <td>1</td>
      <td>°R − 459.67</td>
    </tr>
    <tr>
      <th>°R</th>
      <td>9/5°C + 491.67</td>
      <td>9/5K</td>
      <td>°F + 459.67</td>
      <td>1</td>
    </tr>
  </table>
</body>

</html>
