<!DOCTYPE html>
<html lang="en">

<head>
  <title>Resistance and Conductance Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Resistance and Conductance Unit Conversion</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round
    to
    <input type="number" id="decimals" size="1" min="0" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="resistance_conductance" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="Ohm">Ω</option>
      <option value="uOhm">µΩ</option>
      <option value="mOhm">mΩ</option>
      <option value="kOhm">kΩ</option>
      <option value="MOhm">MΩ</option>
      <option value="S">S</option>
      <option value="uS">µS</option>
      <option value="mS">mS</option>
      <option value="kS">kS</option>
      <option value="MS">MS</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="Ohm">Ω</option>
      <option value="uOhm">µΩ</option>
      <option value="mOhm">mΩ</option>
      <option value="kOhm">kΩ</option>
      <option value="MOhm">MΩ</option>
      <option value="S">S</option>
      <option value="uS">µS</option>
      <option value="mS">mS</option>
      <option value="kS">kS</option>
      <option value="MS">MS</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
