<!DOCTYPE html>
<html lang="en">

<head>
  <title>Drain Flow - GMS</title>
  <meta charset="UTF-8" />
  <style>
    table {
      border-collapse: collapse;
    }

    td,
    th {
      text-align: left;
      padding: 8px;
    }
  </style>
</head>

<body>
  <script src="./js/drainFlowGMSIO.js"></script>
  <script src="./js/modules/unitConversion.js"></script>
  <script src="./js/modules/frictionFactor.js"></script>
  <script src="./js/modules/geometry.js"></script>
  <h1>Drain Flow - GMS</h1>
  Gauckler-Manning-Strickler

  <h2>Input</h2>

  <form>
    <table>
      <tr>
        <td>
          <input type="radio" id="pipe_use" name="pipe_duct" checked />
        </td>
        <td>
          Pipe diameter:
        </td>
        <td>
          <input type="number" id="d_pipe_val" value="10" min="0" size="12" />
        </td>
        <td>
          <select id="d_pipe_unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="in">in</option>
            <option value="ft">ft</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
          <input type="radio" id="duct_use" name="pipe_duct" />
        </td>
        <td>
          Duct size (W x H):
        </td>
        <td>
          <input type="number" id="w_duct_val" value="5" min="0" size="4" />
          <input type="number" id="h_duct_val" value="10" min="0" size="4" />
        </td>
        <td>
          <select id="wh_duct_unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="in">in</option>
            <option value="ft">ft</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
        </td>
        <td>
          Slope:
        </td>
        <td>
          <input type="number" id="slope_val" value="1" step="0.5" min="0" max="100" size="12" />
        </td>
        <td>
          <select id="slope_unit">
            <option value="percent">%</option>
            <option value="m$m">m/m</option>
            <option value="permille">&permil;</option>
            <option value="deg">deg</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
        </td>
        <td>
          Filling height:
        </td>
        <td>
          <input type="number" id="fill_val" value="65" step="5" min="5" max="100" size="12" />
        </td>
        <td>
          <select id="fill_unit">
            <option value="percent">%</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
        </td>
        <td>
          GMS Roughness:
        </td>
        <td>
          <input type="number" id="gms_val" value="0.1" step="0.1" min="0" size="12" />
        </td>
        <td>
          s/m<sup>1/3</sup>
        </td>
      </tr>
    </table>
  </form>


  <br />

  <button type="button" onclick="drainFlowGMSIO()">Calculate</button>

  <br />
  <h2>Output</h2>

  <form>
    <table>
      <tr>
        <td>
          Flow cross-section:
        </td>
        <td>
          <input type="text" id="a_flow_val" size="12" readonly />
        </td>
        <td>
          <select id="a_flow_unit">
            <option value="mm2">mm²</option>
            <option value="cm2">cm²</option>
            <option value="dm2">dm²</option>
            <option value="m2">m²</option>
            <option value="in2">in²</option>
            <option value="ft2">ft²</option>
            <option value="yd2">yd²</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
          Fill cross-section:
        </td>
        <td>
          <input type="text" id="a_fill_val" size="12" readonly />
        </td>
        <td>
          %
        </td>
      </tr>
      <tr>
        <td>
          Froude number:
        </td>
        <td>
          <input type="text" id="fr_val" size="12" readonly />
        </td>
      </tr>
      <tr>
        <td>
          Flow velocity:
        </td>
        <td>
          <input type="text" id="c_val" size="12" readonly />
        </td>
        <td>
          <select id="c_unit">
            <option value="m$s">m/s</option>
            <option value="km$h">km/h</option>
            <option value="ft$s">ft/s</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
          Volumetric flow rate:
        </td>
        <td>
          <input type="text" id="vf_val" size="12" readonly />
        </td>
        <td>
          <select id="vf_unit">
            <option value="m3$h">m³/h</option>
            <option value="m3$min">m³/min</option>
            <option value="m3$s">m³/s</option>
            <option value="l$h">l/h</option>
            <option value="l$min">l/min</option>
            <option value="l$s">l/s</option>
            <option value="ft$min">ft³/min</option>
            <option value="gal$min">gal/min</option>
          </select>
        </td>
      </tr>
    </table>
  </form>
  <p><a href="index.html">Index</a></p>
</body>

</html>
