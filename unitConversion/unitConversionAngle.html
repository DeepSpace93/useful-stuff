<!DOCTYPE html>
<html lang="en">

<head>
  <title>Angle Unit Conversion</title>
  <meta charset="UTF-8" />
</head>

<body>
  <script src="../js/unitConversionIO.js"></script>
  <script src="../js/modules/unitConversion.js"></script>
  <h1>Unit Conversion</h1>
  <h2>Angle</h2>
  <form>
    <input type="checkbox" id="round" checked />
    Round to
    <input type="number" id="decimals" min="0" max="10" value="2" step="1" />
    decimals.
    <br />
    <input type="checkbox" id="sci" />
    Use scientific notation.
  </form>
  <br />
  <form>
    <input type="hidden" id="quantity" value="angle" />
    <input type="number" id="value_in" value="1" />
    <select id="unit_in">
      <option value="deg">deg</option>      
      <option value="rad">rad</option>
      <option value="mrad">mrad</option>
      <option value="urad">µrad</option>
      <option value="rev">rev</option>
      <option value="arcmin">arcmin</option>
      <option value="arcsec">arcsec</option>
    </select>
    =
    <input type="text" id="value_out" readonly />
    <select id="unit_out">
      <option value="rad">rad</option>
      <option value="mrad">mrad</option>
      <option value="urad">µrad</option>
      <option value="deg">deg</option>      
      <option value="rev">rev</option>
      <option value="arcmin">arcmin</option>
      <option value="arcsec">arcsec</option>
    </select>
  </form>
  <br />
  <button type="button" onclick="unitConversionIO()">Convert</button>
  <ul>
    <li>1 rad = 180°/π
    <li>1&#8242; = 1 arcmin = 1°/60</li>
    <li>1&#8243; = 1 arcsec = 1°/3600</li>
  </ul>
  <ul>
    <li>rev = revolution = turn = cycle</li>
  </ul>
  <p><a href="../index.html">Index</a></p>
</body>

</html>
