<!DOCTYPE html>
<html lang="en">

<head>
    <title>Thermal Expansion</title>
    <meta charset="UTF-8" />
</head>

<body>
    <script src="./js/thermalExpansionIO.js"></script>
    <script src="./js/modules/unitConversion.js"></script>
    <h1>Thermal Expansion</h1>
    <h2>Linear</h2>

    <form>
        <table>
            <tr>
                <td>
                    Initial length:
                </td>
                <td>
                    <input type="number" id="l0_val" value="10" />
                </td>
                <td>
                    <select id="l0_unit">
                        <option value="m">m</option>
                        <option value="um">µm</option>
                        <option value="mm">mm</option>
                        <option value="cm">cm</option>
                        <option value="dm">dm</option>
                        <option value="km">km</option>
                        <option value="thou">thou</option>
                        <option value="in">in</option>
                        <option value="ft">ft</option>
                        <option value="yd">yd</option>
                        <option value="mi">mi</option>
                        <option value="NM">NM</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Temp. difference:
                </td>
                <td>
                    <input type="number" id="dT_val" value="10" />
                </td>
                <td>
                    <select id="dT_unit">
                        <option value="K">K</option>
                        <option value="R">°R</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Linear CTE:
                </td>
                <td>
                    <input type="number" id="CTE_val" value="17.3" />
                </td>
                <td>
                    <select id="CTE_unit">
                        <option value="$E6K">1E-6/K</option>
                        <option value="$K">1/K</option>
                    </select>
                </td>
            </tr>
        </table>
    </form>
    <br />
    <button type="button" onclick="thermalExpansionLinearIO()">Calculate</button>
    <br />
    <br />

    <form>
        <table>
            <tr>
                <td>
                    Expansion:
                </td>
                <td>
                    <input type="text" id="dl_val" readonly />
                </td>
                <td>
                    <select id="dl_unit">
                        <option value="mm">mm</option>
                        <option value="m">m</option>
                        <option value="um">µm</option>
                        <option value="cm">cm</option>
                        <option value="dm">dm</option>
                        <option value="km">km</option>
                        <option value="thou">thou</option>
                        <option value="in">in</option>
                        <option value="ft">ft</option>
                        <option value="yd">yd</option>
                        <option value="mi">mi</option>
                        <option value="NM">NM</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Final length:
                </td>
                <td>
                    <input type="text" id="l_val" readonly />
                </td>
                <td>
                    <select id="l_unit">
                        <option value="m">m</option>
                        <option value="um">µm</option>
                        <option value="mm">mm</option>
                        <option value="cm">cm</option>
                        <option value="dm">dm</option>
                        <option value="km">km</option>
                        <option value="thou">thou</option>
                        <option value="in">in</option>
                        <option value="ft">ft</option>
                        <option value="yd">yd</option>
                        <option value="mi">mi</option>
                        <option value="NM">NM</option>
                    </select>
                </td>
            </tr>
        </table>
    </form>

    <p><a href="index.html">Index</a></p>
</body>

</html>
