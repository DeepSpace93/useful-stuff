<!DOCTYPE html>
<html lang="en">

<head>
  <title>Orifice 2</title>
  <meta charset="UTF-8" />
  <style>
    table {
      border-collapse: collapse;
    }

    td,
    th {
      text-align: left;
      padding: 8px;
    }
  </style>

</head>

<body>
  <script src="./js/orificeIO2.js"></script>
  <script src="./js/modules/unitConversion.js"></script>
  <h1>Orifice</h1>
  <form>
    <table>
      <tr>
        <td>p<sub>up</sub></td>
        <td>Pressure upstream:</td>
        <td>
          <input type="number" id="p_up_val" value="1" />
        </td>
        <td>
          <select id="p_up_unit">
            <option value="bar">bar</option>
            <option value="Pa">Pa</option>
            <option value="hPa">hPa</option>
            <option value="kPa">kPa</option>
            <option value="MPa">MPa</option>
            <option value="bar">bar</option>
          </select>
        </td>
        <td>
          <select id="p_up_abs">
            <option value="rel">rel</option>
            <option value="abs">abs</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>p<sub>down</sub></td>
        <td>Pressure downstream:</td>
        <td>
          <input type="number" id="p_down_val" value="0" />
        </td>
        <td>
          <select id="p_down_unit">
            <option value="bar">bar</option>
            <option value="Pa">Pa</option>
            <option value="hPa">hPa</option>
            <option value="kPa">kPa</option>
            <option value="MPa">MPa</option>
            <option value="bar">bar</option>
          </select>
        </td>
        <td>
          <select id="p_down_abs">
            <option value="rel">rel</option>
            <option value="abs">abs</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>T</td>
        <td>Temperature:</td>
        <td>
          <input type="number" id="T_val" value="20" />
        </td>
        <td>
          <select id="T_unit">
            <option value="C">°C</option>
            <option value="K">K</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>ρ</td>
        <td>Density:</td>
        <td>
          <input type="number" id="rho_val" value="1" />
        </td>
        <td>
          <select id="rho_unit">
            <option value="kg$m3">kg/m³</option>
            <option value="g$cm3">g/cm³</option>
            <option value="g$l">g/l</option>
            <option value="kg$l">kg/l</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>γ</td>
        <td>Heat capacity ratio:</td>
        <td>
          <input type="number" id="gamma_val" value="1.30" step="0.01" />
        </td>
        <td>
        </td>
      </tr>
      <tr>
        <td>R<sub>s</sub></td>
        <td>Specific gas constant:</td>
        <td>
          <input type="number" id="R_s_val" value="200" />
        </td>
        <td>
          <select id="R_s_unit">
            <option value="J$kg$K">J/(kg·K)</option>
            <option value="kJ$kg$K">kJ/(kg·K)</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>C</td>
        <td>Discharge coefficient:</td>
        <td>
          <input type="number" id="C_val" value="0.80" step="0.01" />
        </td>
        <td>
        </td>
      </tr>
      <tr>
        <td>d</td>
        <td>Orifice hole diameter:</td>
        <td>
          <input type="number" id="d_val" value="1.0" step="0.1" />
        </td>
        <td>
          <select id="d_unit">
            <option value="mm">mm</option>
            <option value="um">µm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>A</td>
        <td>Orifice hole area:</td>
        <td>
          <input type="text" id="a_val" readonly />
        </td>
        <td>
          <select id="a_unit">
            <option value="mm2">mm²</option>
            <option value="cm2">cm²</option>
            <option value="dm2">dm²</option>
            <option value="m2">m²</option>
          </select>
        </td>
      </tr>
    </table>
  </form>

  <br />

  <button type="button" onclick="orificeIO()">Calculate</button>

  <br />

  <h2>Output</h2>

  <form>
    <table>
      <tr>
        <td></td>
        <td>Conditions</td>
        <td>
          <input type="text" id="cond" readonly />
        </td>
      </tr>
      <tr>
        <td>m*</td>
        <td>Mass flow rate</td>
        <td>
          <input type="text" id="mf_val" readonly />
        </td>
        <td>
          <select id="mf_unit">
            <option value="g$s">g/s</option>
            <option value="kg$h">kg/h</option>
            <option value="kg$min">kg/min</option>
            <option value="kg$s">kg/s</option>
            <option value="g$h">g/h</option>
            <option value="g$min">g/min</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>V*</td>
        <td>Volumetric flow rate</td>
        <td>
          <input type="text" id="vf_val" readonly />
        </td>
        <td>
          <select id="vf_unit">
            <option value="l$min">l/min</option>
            <option value="m3$h">m³/h</option>
            <option value="m3$min">m³/min</option>
            <option value="m3$s">m³/s</option>
            <option value="l$h">l/h</option>
            <option value="l$s">l/s</option>
            <option value="ft3$h">ft³/h</option>
            <option value="ft3$min">ft³/min</option>
            <option value="ft3$s">ft³/s</option>
            <option value="gal$h">gal/h</option>
            <option value="gal$min">gal/min</option>
            <option value="gal$s">gal/s</option>
          </select>
        </td>
      </tr>


    </table>
  </form>

  <p><a href="index.html">Index</a></p>
</body>

</html>
